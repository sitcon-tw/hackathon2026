<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主題 / 隊伍 更動倒數</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #ff2a2a;
    --red-dim: #b31212;
    --red-glow: rgba(255, 42, 42, .55);
    --bg: #070303;
  }

  /* ---- 緊迫階段速度（JS 切換 body class） ---- */
  body        { --pulse: 4s;   --blink: 2s;   --hazard: 1.1s; --heart: 1.2s; }
  body.u-hours { --pulse: 2.6s; --blink: 1s;   --hazard: .8s; }
  body.u-min10 { --pulse: 1.6s; --blink: .5s;  --hazard: .5s;  --heart: .9s; }
  body.u-min   { --pulse: 1s;   --blink: .25s; --hazard: .32s; --heart: .6s; }
  body.u-final { --pulse: .55s; --blink: .14s; --hazard: .2s;  --heart: .42s; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  body::before, body::after {
    content: '';
    position: fixed; inset: -25vmax; pointer-events: none; z-index: 0;
  }
  body::before {
    background: repeating-radial-gradient(circle at center, transparent 0 7vmin, rgba(255, 42, 42, .055) 7.15vmin 7.3vmin);
    animation: radarSweep 16s linear infinite;
  }
  body::after {
    opacity: .28;
    background-image: radial-gradient(circle, rgba(255, 180, 180, .7) 0 1px, transparent 1.5px);
    background-size: 52px 52px;
    mask-image: radial-gradient(circle at center, #000, transparent 72%);
    animation: starDrift 18s linear infinite;
  }
  @keyframes radarSweep { to { transform: rotate(360deg); } }
  @keyframes starDrift { to { background-position: 52px -104px; } }

  /* ---- 背景特效 ---- */
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 50% at 50% 30%, rgba(255, 30, 30, .18), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(120, 0, 0, .25), transparent 70%);
    animation: breathe 4s ease-in-out infinite;
  }
  .bg-grid {
    position: fixed; inset: -50%; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 42, 42, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 42, 42, .05) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(60deg) translateY(-20%);
    animation: gridmove 12s linear infinite;
    opacity: .6;
  }
  .scanline {
    position: fixed; left: 0; right: 0; height: 140px; pointer-events: none;
    background: linear-gradient(transparent, rgba(255, 42, 42, .07), transparent);
    animation: scan 6s linear infinite;
  }
  @keyframes breathe { 50% { opacity: .65; } }
  @keyframes gridmove { to { background-position: 0 60px, 60px 0; } }
  @keyframes scan { from { top: -140px; } to { top: 100%; } }

  /* ---- 緊迫氛圍層 ---- */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    opacity: 0; transition: opacity .6s;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(255, 0, 0, .32) 100%);
  }
  body.u-min10 .vignette, body.u-min .vignette, body.u-final .vignette {
    opacity: 1;
    animation: heartbeat var(--heart) ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 45%, 100% { transform: scale(1); }
    14% { transform: scale(1.06); }
    28% { transform: scale(1.01); }
  }

  .beacon {
    position: fixed; top: 50%; width: 24vmin; height: 24vmin; margin-top: -12vmin;
    pointer-events: none; z-index: 1; opacity: 0;
    background: radial-gradient(circle, rgba(255, 30, 30, .55), transparent 62%);
    filter: blur(10px);
  }
  .beacon-l { left: -12vmin; }
  .beacon-r { right: -12vmin; }
  body.u-min .beacon, body.u-final .beacon { animation: beaconFlash .9s linear infinite; }
  body.u-final .beacon { animation-duration: .45s; }
  .beacon-r { animation-delay: .45s; }
  body.u-final .beacon-r { animation-delay: .225s; }
  @keyframes beaconFlash { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }

  .alert-strip {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 36px;
    display: flex; align-items: center; overflow: hidden; pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 42, 42, .18), rgba(255, 42, 42, .4) 50%, rgba(255, 42, 42, .18));
    border-bottom: 1px solid rgba(255, 42, 42, .55);
    box-shadow: 0 4px 24px rgba(255, 0, 0, .3);
    opacity: 0; transform: translateY(-100%);
    transition: opacity .4s, transform .4s;
  }
  body.u-hours .alert-strip, body.u-min10 .alert-strip,
  body.u-min .alert-strip, body.u-final .alert-strip { opacity: 1; transform: none; }
  .alert-track { display: flex; width: max-content; white-space: nowrap; animation: marquee 18s linear infinite; }
  body.u-min .alert-track { animation-duration: 9s; }
  body.u-final .alert-track { animation-duration: 5s; }
  .alert-track span {
    font-size: 12px; font-weight: 700; letter-spacing: .35em;
    color: #ffb0b0; padding-right: .35em;
  }
  @keyframes marquee { to { transform: translateX(-50%); } }

  #embers { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .ember {
    position: absolute; bottom: -12px; display: block; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 130, 70, .95), rgba(255, 42, 42, 0) 70%);
    opacity: 0;
    animation: emberRise linear infinite;
  }
  @keyframes emberRise {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    10% { opacity: .85; }
    100% { transform: translate(var(--drift, 40px), -106vh) scale(.2); opacity: 0; }
  }

  .alarm-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: rgba(255, 0, 0, .18); opacity: 0;
  }
  body.done .alarm-flash { animation: alarmFlash .6s linear infinite; }
  @keyframes alarmFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .final-overlay {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    display: grid; place-items: center;
  }
  .final-num {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-weight: 900; line-height: 1;
    font-size: clamp(140px, 40vmin, 460px);
    color: var(--red);
    text-shadow: 0 0 40px var(--red), 0 0 120px rgba(255, 0, 0, .9);
    opacity: 0;
  }
  .final-ring {
    position: absolute; top: 50%; left: 50%;
    width: 34vmin; height: 34vmin; margin: -17vmin 0 0 -17vmin;
    border-radius: 50%; border: 4px solid var(--red); opacity: 0;
  }
  .final-overlay.go .final-num { animation: finalPunch 1s cubic-bezier(.16, 1, .3, 1) both; }
  .final-overlay.go .final-ring { animation: ringOut 1s ease-out both; }
  @keyframes finalPunch {
    0% { transform: scale(2.6); opacity: 0; filter: blur(24px); }
    16% { transform: scale(1); opacity: 1; filter: blur(0); }
    72% { transform: scale(.96); opacity: 1; }
    100% { transform: scale(.8); opacity: 0; }
  }
  @keyframes ringOut {
    0% { transform: scale(.2); opacity: .9; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  .phase-impact {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
    pointer-events: none; opacity: 0;
  }
  .phase-impact span {
    max-width: min(90vw, 720px); padding: 14px 26px; border: 2px solid rgba(255, 110, 110, .9); border-radius: 12px;
    background: rgba(48, 0, 0, .76); color: #fff; font-size: clamp(18px, 4vw, 42px); font-weight: 900;
    letter-spacing: .14em; text-align: center; text-shadow: 0 0 18px var(--red), 0 0 58px rgba(255, 0, 0, .9);
    box-shadow: 0 0 46px rgba(255, 0, 0, .5);
  }
  .phase-impact.go { animation: impactShow 2s cubic-bezier(.2, .9, .3, 1) both; }
  @keyframes impactShow {
    0% { opacity: 0; transform: scale(2.3); filter: blur(18px); }
    12%, 80% { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(.9); filter: blur(5px); }
  }

  /* ---- 標題 ---- */
  .stage { position: relative; z-index: 2; text-align: center; }

  .eyebrow {
    color: var(--red);
    letter-spacing: .5em;
    font-size: clamp(11px, 2vw, 14px);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(26px, 5.5vw, 56px);
    font-weight: 900;
    letter-spacing: .12em;
    color: #fff;
    text-shadow: 0 0 18px var(--red-glow), 0 0 60px rgba(255, 0, 0, .3);
    animation: titleGlitch 7s infinite;
  }
  body.u-final h1 { animation: titleGlitch 1.2s infinite; }
  @keyframes titleGlitch {
    0%, 91%, 96%, 100% { transform: none; }
    92% { transform: translate(-3px, 2px) skewX(-6deg); text-shadow: -4px 0 rgba(0, 220, 255, .7), 4px 0 rgba(255, 0, 80, .8), 0 0 60px rgba(255, 0, 0, .3); }
    94% { transform: translate(3px, -2px) skewX(4deg); text-shadow: 4px 0 rgba(0, 220, 255, .7), -4px 0 rgba(255, 0, 80, .8); }
  }
  h1 .accent { color: var(--red); }

  .target-time {
    margin-top: 10px;
    color: rgba(255, 255, 255, .45);
    font-size: clamp(12px, 2vw, 15px);
    letter-spacing: .2em;
  }
  .target-time b { color: rgba(255, 120, 120, .9); font-weight: 600; }

  /* ---- 倒數節奏 ---- */
  .phase-board {
    width: min(92vw, 640px); margin: 18px auto 4px; padding: 12px 15px 11px;
    border: 1px solid rgba(255, 75, 75, .28); border-radius: 12px;
    background: linear-gradient(105deg, rgba(255, 42, 42, .09), rgba(255, 42, 42, .02) 54%, rgba(255, 42, 42, .12));
    box-shadow: inset 0 0 28px rgba(255, 20, 20, .05), 0 0 26px rgba(255, 20, 20, .08);
    backdrop-filter: blur(5px);
  }
  .phase-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .phase-head b { color: #fff; font-size: clamp(13px, 2vw, 16px); letter-spacing: .12em; }
  .phase-head span { color: rgba(255, 202, 202, .68); font-size: 11px; letter-spacing: .13em; }
  .phase-track { height: 5px; margin: 11px 0 8px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, .12); }
  .phase-fill {
    display: block; width: var(--phase-progress, 8%); height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, #ffb020, #ff2a2a 62%, #ff0055);
    box-shadow: 0 0 16px rgba(255, 42, 42, .9); transition: width .8s cubic-bezier(.2, .9, .3, 1);
  }
  .phase-steps { display: flex; justify-content: space-between; gap: 3px; color: rgba(255, 255, 255, .38); font-size: clamp(8px, 1.5vw, 10px); font-weight: 800; letter-spacing: .04em; }
  .phase-steps span { transition: color .35s, text-shadow .35s; }
  .phase-steps span.active { color: #ffbab2; text-shadow: 0 0 10px var(--red); }
  body.u-min .phase-board, body.u-final .phase-board { border-color: rgba(255, 60, 60, .65); animation: phasePulse var(--pulse) ease-in-out infinite; }
  @keyframes phasePulse { 50% { box-shadow: inset 0 0 34px rgba(255, 20, 20, .14), 0 0 35px rgba(255, 20, 20, .28); } }

  /* ---- 倒數 ---- */
  .countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 2vw, 22px);
    margin-top: 8px;
  }

  .unit { text-align: center; min-width: clamp(64px, 14vw, 150px); }

  .num {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-weight: 800;
    font-size: clamp(44px, 11vw, 120px);
    line-height: 1.1;
    color: #fff;
    text-shadow:
      0 0 8px rgba(255, 255, 255, .4),
      0 0 24px var(--red-glow),
      0 0 70px rgba(255, 0, 0, .45);
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: center;
  }

  .digit { display: inline-block; min-width: .62em; }
  .digit.roll { animation: rollIn .5s cubic-bezier(.2, .9, .3, 1.25) both; }
  @keyframes rollIn {
    0% { transform: translateY(.55em) scale(.7); opacity: 0; filter: blur(10px); }
    0%, 55% { color: var(--red); }
    55% { transform: translateY(-.05em) scale(1.12); opacity: 1; filter: blur(0); }
  }

  .unit:not(.days) .num.punch { animation: punch .5s cubic-bezier(.2, .9, .3, 1.3); }
  @keyframes punch {
    0% { transform: scale(1.16); filter: brightness(1.9) drop-shadow(0 0 26px var(--red)); }
    100% { transform: scale(1); filter: none; }
  }

  .label {
    margin-top: 10px;
    font-size: clamp(10px, 1.6vw, 14px);
    letter-spacing: .4em;
    color: var(--red);
    font-weight: 700;
  }

  .colon {
    font-size: clamp(30px, 7vw, 80px);
    font-weight: 800;
    color: var(--red);
    text-shadow: 0 0 20px var(--red-glow);
    animation: blink var(--blink) step-end infinite;
    transform: translateY(-10px);
  }
  @keyframes blink { 50% { opacity: .25; } }

  /* 緊迫階段：數字染紅 */
  body.u-min10 .unit.seconds .num {
    color: var(--red);
    text-shadow: 0 0 12px var(--red), 0 0 46px var(--red-glow), 0 0 100px rgba(255, 0, 0, .65);
  }
  body.u-min .unit.minutes .num,
  body.u-min .unit.seconds .num {
    color: var(--red);
    text-shadow: 0 0 12px var(--red), 0 0 46px var(--red-glow), 0 0 100px rgba(255, 0, 0, .65);
  }
  body.u-final .unit:not(.days) .num {
    color: var(--red);
    text-shadow: 0 0 14px var(--red), 0 0 52px var(--red-glow), 0 0 120px rgba(255, 0, 0, .8);
  }

  body.u-min .stage { animation: jitter 1.1s ease-in-out infinite; }
  body.u-final .stage { animation: jitter .45s linear infinite; }
  @keyframes jitter {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-1.5px, 1px); }
    40% { transform: translate(1.5px, -1px); }
    60% { transform: translate(-1px, -1.5px); }
    80% { transform: translate(1px, 1.5px); }
  }

  /* 引線警示條 */
  .hazard {
    width: min(92vw, 640px);
    height: 7px;
    margin: 22px auto 0;
    border-radius: 4px;
    overflow: hidden;
    background: rgba(255, 42, 42, .1);
    border: 1px solid rgba(255, 42, 42, .35);
    position: relative;
  }
  .hazard i {
    position: absolute; inset: 0; display: block;
    background: repeating-linear-gradient(90deg, var(--red) 0 18px, transparent 18px 36px);
    animation: hazardMove var(--hazard) linear infinite;
    opacity: .9;
  }
  @keyframes hazardMove { to { transform: translateX(36px); } }

  /* ---- 倒數結束 ---- */
  .done-msg {
    display: none;
    margin-top: 16px;
    font-size: clamp(24px, 5vw, 52px);
    font-weight: 900;
    letter-spacing: .3em;
    color: var(--red);
    text-shadow: 0 0 20px var(--red), 0 0 70px rgba(255, 0, 0, .7);
  }
  body.done .done-msg { display: block; animation: alarmShake .9s ease-in-out infinite; }
  @keyframes alarmShake {
    0%, 100% { opacity: 1; transform: scale(1); }
    25% { opacity: .5; transform: scale(.97) translateX(-4px); }
    50% { opacity: .3; transform: scale(.95); }
    75% { opacity: .5; transform: scale(.97) translateX(4px); }
  }
  body.done .countdown { opacity: .25; filter: grayscale(.6); }
  body.done .hazard { display: none; }

  /* ---- QR 卡片 ---- */
  .qr-card {
    position: relative; z-index: 2;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 18px 26px;
    background: linear-gradient(145deg, rgba(40, 5, 5, .9), rgba(15, 2, 2, .9));
    border: 1px solid rgba(255, 42, 42, .35);
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(255, 20, 20, .15), inset 0 0 30px rgba(255, 20, 20, .05);
    text-decoration: none;
    color: #fff;
    transition: transform .25s, box-shadow .25s;
    backdrop-filter: blur(4px);
  }
  .qr-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 50px rgba(255, 20, 20, .35), inset 0 0 30px rgba(255, 20, 20, .08);
    border-color: rgba(255, 42, 42, .7);
  }

  .qr-frame {
    padding: 8px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 18px var(--red-glow);
    flex-shrink: 0;
  }
  .qr-frame canvas, .qr-frame img { display: block; width: clamp(96px, 14vw, 132px); height: auto; }

  .qr-text small {
    display: block;
    color: var(--red);
    letter-spacing: .35em;
    font-weight: 700;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .qr-text strong {
    font-size: clamp(15px, 2.4vw, 20px);
    letter-spacing: .1em;
    font-weight: 800;
    text-shadow: 0 0 12px var(--red-glow);
  }
  .qr-text span {
    display: block;
    margin-top: 6px;
    color: rgba(255, 255, 255, .45);
    font-size: 12px;
    letter-spacing: .05em;
    max-width: 220px;
    word-break: break-all;
  }

  footer {
    position: relative; z-index: 2;
    color: rgba(255, 255, 255, .25);
    font-size: 11px;
    letter-spacing: .25em;
  }

  @media (max-width: 560px) {
    .qr-card { flex-direction: column; text-align: center; gap: 12px; padding: 20px; }
    .qr-text span { max-width: 260px; margin-inline: auto; }
    .colon { display: none; }
    .beacon { width: 30vmin; height: 30vmin; margin-top: -15vmin; }
    .alert-track span { font-size: 10px; letter-spacing: .25em; }
  }

  /* 1920 x 1080 投影畫面：所有資訊維持在單一畫面內。 */
  @media (min-width: 900px) and (min-height: 1000px) {
    body { height: 100vh; gap: 18px; padding: 18px 32px 12px; overflow: hidden; }
    .phase-board { margin: 12px auto 2px; padding: 10px 14px 9px; }
    .phase-track { margin: 8px 0 6px; }
    .hazard { margin-top: 14px; }
    .qr-card { gap: 16px; padding: 12px 20px; }
    .qr-frame { padding: 6px; }
    .qr-frame canvas, .qr-frame img { width: 104px; }
    footer { font-size: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="alert-strip" aria-hidden="true">
  <div class="alert-track">
    <span>⚠ 倒數加速中 ⚠ 請儘速完成更動 ⚠ FINAL CALL ⚠ 立即掃描 QR 前往表單 ⚠&nbsp;</span>
    <span>⚠ 倒數加速中 ⚠ 請儘速完成更動 ⚠ FINAL CALL ⚠ 立即掃描 QR 前往表單 ⚠&nbsp;</span>
  </div>
</div>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scanline"></div>
<div class="vignette"></div>
<div class="beacon beacon-l"></div>
<div class="beacon beacon-r"></div>
<div id="embers"></div>
<div class="alarm-flash"></div>

<div class="stage">
  <div class="eyebrow">⚠ CHANGE OVER ⚠</div>
  <h1 id="pageTitle">主題 <span class="accent">/</span> 隊伍 更動倒數</h1>
  <div class="target-time">更動時間｜<b id="targetText">—</b></div>

  <div class="phase-board" aria-live="polite">
    <div class="phase-head"><b id="phaseText">倒數準備中</b><span id="phaseNote">請確認更動內容</span></div>
    <div class="phase-track" aria-hidden="true"><i class="phase-fill" id="phaseFill"></i></div>
    <div class="phase-steps" aria-hidden="true">
      <span data-at="120">2H</span><span data-at="60">1H</span><span data-at="50">50</span><span data-at="40">40</span><span data-at="30">30</span><span data-at="20">20</span><span data-at="10">10</span><span data-at="5">5</span><span data-at="3">3</span><span data-at="2">2</span><span data-at="1">1M</span>
    </div>
  </div>

  <div class="countdown" role="timer" aria-label="倒數計時">
    <div class="unit days"><span class="num" id="d"></span><span class="label">天</span></div>
    <span class="colon">:</span>
    <div class="unit hours"><span class="num" id="h"></span><span class="label">時</span></div>
    <span class="colon">:</span>
    <div class="unit minutes"><span class="num" id="m"></span><span class="label">分</span></div>
    <span class="colon">:</span>
    <div class="unit seconds"><span class="num" id="s"></span><span class="label">秒</span></div>
  </div>

  <div class="hazard" aria-hidden="true"><i></i></div>

  <div class="done-msg">🔥 更動時間已到 🔥</div>
</div>

<div class="final-overlay" id="finalOverlay" aria-hidden="true">
  <i class="final-ring"></i>
  <span class="final-num" id="finalNum"></span>
</div>

<div class="phase-impact" id="phaseImpact" aria-hidden="true"><span id="impactText"></span></div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],

<script>
/* ================= 設定區（可直接修改） =================
   也可用網址參數暫時覆蓋，不改檔案：
   countdown.html?title=標題&date=2026-09-05T20:00&url=https://表單網址
   ====================================================== */
const CONFIG = {
  title: '主題 <span class="accent">/</span> 隊伍 更動倒數',  // 可含 HTML
  date:  '2026-09-05T16:30:00',                             // 更動時間 (ISO 格式)
  url:   'https://hackathon2026.sitcon.org/#actions'         // 更動表單網址
};
/* ====================================================== */

(() => {
  const q = new URLSearchParams(location.search);
  const title = q.get('title') ?? CONFIG.title;
  const dateStr = q.get('date') ?? CONFIG.date;
  const formUrl = q.get('url') ?? CONFIG.url;
  const target = new Date(dateStr).getTime();

  document.getElementById('pageTitle').innerHTML = title;
  document.getElementById('targetText').textContent =
    new Date(dateStr).toLocaleString('zh-TW', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  document.getElementById('formUrlText').textContent = formUrl;
  document.getElementById('qrCard').href = formUrl;

  /* ---- QR Code ---- */
  try {
    const qr = qrcode(0, 'M');
    qr.addData(formUrl);
    qr.make();
    document.getElementById('qrFrame').innerHTML = qr.createImgTag(4, 8);
  } catch (e) {
    const img = document.createElement('img');
    img.alt = 'QR Code';
    img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(formUrl);
    document.getElementById('qrFrame').appendChild(img);
  }

  /* ---- 餘燼粒子 ---- */
  const embersBox = document.getElementById('embers');
  for (let i = 0; i < 26; i++) {
    const e = document.createElement('i');
    e.className = 'ember';
    const size = 3 + Math.random() * 7;
    e.style.width = e.style.height = size + 'px';
    e.style.left = Math.random() * 100 + '%';
    e.style.animationDuration = 6 + Math.random() * 8 + 's';
    e.style.animationDelay = -Math.random() * 14 + 's';
    e.style.setProperty('--drift', (Math.random() * 140 - 70) + 'px');
    embersBox.appendChild(e);
  }

  /* ---- 倒數 ---- */
  const els = { d: document.getElementById('d'), h: document.getElementById('h'),
                m: document.getElementById('m'), s: document.getElementById('s') };
  const finalOverlay = document.getElementById('finalOverlay');
  const finalNumEl = document.getElementById('finalNum');
  const phaseTextEl = document.getElementById('phaseText');
  const phaseNoteEl = document.getElementById('phaseNote');
  const phaseFillEl = document.getElementById('phaseFill');
  const phaseSteps = document.querySelectorAll('.phase-steps span');
  const impactEl = document.getElementById('phaseImpact');
  const impactTextEl = document.getElementById('impactText');
  const PHASES = ['u-hours', 'u-min10', 'u-min', 'u-final'];
  const PHASE_COPY = {
    '':        ['準備階段', '保留時間檢查內容與連結'],
    'u-hours': ['2 小時警戒', '確認變更後立即送出'],
    'u-min10': ['30 分鐘行動', '這是最後一次完整檢查'],
    'u-min':   ['5 分鐘緊急', '現在送出，不要再等待'],
    'u-final': ['最後 10 秒', '立即完成更動'],
    'done':    ['更動時間已到', '表單已關閉']
  };
  const MILESTONES = [
    { at: 120, text: '⚠ 剩 2 小時｜確認後即可送出' },
    { at: 60, text: '⚠ 剩 1 小時｜完成最後檢查' },
    { at: 50, text: '⚠ 剩 50 分鐘｜確認表單資料' },
    { at: 40, text: '⚠ 剩 40 分鐘｜檢查隊伍與主題' },
    { at: 30, text: '⚠ 剩 30 分鐘｜最後完整檢查' },
    { at: 20, text: '⚠ 剩 20 分鐘｜請立即送出' },
    { at: 10, text: '⚠ 剩 10 分鐘｜截止警戒' },
    { at: 5, text: '⚠ 剩 5 分鐘｜立即送出' },
    { at: 3, text: '⚠ 剩 3 分鐘｜最後確認' },
    { at: 2, text: '⚠ 剩 2 分鐘｜不要再等待' },
    { at: 1, text: '🔥 最後 1 分鐘｜不要錯過截止時間' }
  ];
  const shownMilestones = new Set();
  let finished = false;
  let lastPhase = null;
  let lastFinal = null;
  let lastRemainingMinute = null;

  function setNum(el, str) {
    const chars = [...String(str)];
    let changed = false;
    while (el.children.length < chars.length) {
      const d = document.createElement('span');
      d.className = 'digit';
      el.appendChild(d);
    }
    while (el.children.length > chars.length) el.lastElementChild.remove();
    chars.forEach((ch, i) => {
      const d = el.children[i];
      if (d.textContent !== ch) {
        changed = true;
        d.textContent = ch;
        d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll');
      }
    });
    return changed;
  }

  function rePunch(el) {
    el.classList.remove('punch'); void el.offsetWidth; el.classList.add('punch');
  }

  function phaseFor(ms) {
    if (ms <= 0) return 'done';
    if (ms <= 10e3) return 'u-final';
    if (ms <= 300e3) return 'u-min';
    if (ms <= 1800e3) return 'u-min10';
    if (ms <= 7200e3) return 'u-hours';
    return '';
  }

  function setPhaseCopy(phase, minutesLeft) {
    const [title, note] = PHASE_COPY[phase];
    const reached = [...phaseSteps].filter(step => minutesLeft <= Number(step.dataset.at)).length;
    phaseTextEl.textContent = title;
    phaseNoteEl.textContent = note;
    phaseFillEl.style.setProperty('--phase-progress', (8 + reached / phaseSteps.length * 92) + '%');
    phaseSteps.forEach(step => step.classList.toggle('active', minutesLeft <= Number(step.dataset.at)));
  }

  function showImpact(text) {
    impactTextEl.textContent = text;
    impactEl.classList.remove('go'); void impactEl.offsetWidth; impactEl.classList.add('go');
  }

  function updateMilestones(minutesLeft) {
    if (lastRemainingMinute === null) {
      MILESTONES.forEach(({ at }) => { if (minutesLeft <= at) shownMilestones.add(at); });
      lastRemainingMinute = minutesLeft;
      return;
    }
    for (const milestone of MILESTONES) {
      if (lastRemainingMinute > milestone.at && minutesLeft <= milestone.at && !shownMilestones.has(milestone.at)) {
        shownMilestones.add(milestone.at);
        showImpact(milestone.text);
        break;
      }
    }
    lastRemainingMinute = minutesLeft;
  }

  function render() {
    const diff = target - Date.now();
    if (diff <= 0) {
      if (!finished) {
        finished = true;
        PHASES.forEach(c => document.body.classList.remove(c));
        document.body.classList.add('done');
        Object.values(els).forEach(el => setNum(el, '00'));
        finalOverlay.classList.remove('go');
        setPhaseCopy('done', 0);
        showImpact('⛔ 更動時間已到');
      }
      return;
    }

    const phase = phaseFor(diff);
    const minutesLeft = Math.ceil(diff / 6e4);
    updateMilestones(minutesLeft);
    if (phase !== lastPhase) {
      lastPhase = phase;
      PHASES.forEach(c => document.body.classList.toggle(c, c === phase));
    }
    setPhaseCopy(phase, minutesLeft);

    const d = Math.floor(diff / 864e5);
    const h = Math.floor(diff % 864e5 / 36e5);
    const m = Math.floor(diff % 36e5 / 6e4);
    const s = Math.floor(diff % 6e4 / 1e3);

    [['d', d], ['h', h], ['m', m], ['s', s]].forEach(([k, v]) => {
      const text = String(v).padStart(2, '0');
      if (setNum(els[k], text) && k !== 'd') rePunch(els[k]);
    });

    if (phase === 'u-final') {
      const secs = Math.ceil(diff / 1e3);
      if (secs !== lastFinal) {
        lastFinal = secs;
        finalNumEl.textContent = secs;
        finalOverlay.classList.remove('go'); void finalOverlay.offsetWidth; finalOverlay.classList.add('go');
      }
    } else if (lastFinal !== null) {
      lastFinal = null;
      finalOverlay.classList.remove('go');
    }
  }

  render();
  setInterval(render, 100);
})();
</script>
